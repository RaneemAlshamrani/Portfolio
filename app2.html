<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Explorer | API App</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        .search-container input {
            flex: 1;
            padding: 12px;
            border: 1px solid #cbb4bc;
            border-radius: 8px;
        }
        .countries-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .country-card {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .country-card img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 10px;
            border: 1px solid #f0f0f0;
        }
        .country-card h3 { font-size: 1.1em; margin-bottom: 8px; color: var(--dark-purple); }
        .country-card p { font-size: 0.85em; color: #666; margin: 4px 0; }
        .status-msg { text-align: center; padding: 20px; color: #6c5270; font-weight: bold; }
    </style>
</head>
<body>

    <header class="main-header">
        <nav>
            <a href="index.html">Home</a>
            <a href="schedule.html">Class Schedule</a>
            <a href="myworks.html" class="active">My Works</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <div class="dashboard-wrapper">
        <aside class="sidebar">
            <div class="profile-section">
                <h3>About This App</h3>
                <p>This app fetches live data from the <strong>REST Countries API</strong> to help you explore world nations.</p>
            </div>
            <nav class="sidebar-nav" style="margin-top: 20px;">
                <a href="myworks.html" class="fragment-link">Back to My Works</a>
                <a href="part2.html" class="fragment-link">View To-Do App</a>
            </nav>
        </aside>

        <main class="main-content">
            <section class="card">
                <h2>Country Explorer</h2>
                <p style="margin-bottom: 20px;">Search for a country to see its details fetched live from the API.</p>

                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="Enter country name (e.g., Saudi Arabia)">
                    <button id="searchBtn" class="submit-btn">Search</button>
                </div>

                <div id="statusMessage" class="status-msg" style="display: none;">Loading...</div>
                <div id="countriesGrid" class="countries-grid"></div>
            </section>
        </main>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const countriesGrid = document.getElementById('countriesGrid');
        const statusMessage = document.getElementById('statusMessage');

        async function fetchCountry(name) {
            countriesGrid.innerHTML = '';
            statusMessage.style.display = 'block';
            statusMessage.textContent = 'Searching for countries...';

            try {
                const response = await fetch(`https://restcountries.com/v3.1/name/${name}`);
                if (!response.ok) throw new Error('Country not found');

                const data = await response.json();
                displayCountries(data);
                statusMessage.style.display = 'none';

            } catch (error) {
                statusMessage.textContent = 'No countries found. Please try a different name.';
            }
        }

        function displayCountries(countries) {
            countriesGrid.innerHTML = countries.map(country => `
                <div class="country-card">
                    <img src="${country.flags.svg}" alt="Flag of ${country.name.common}">
                    <h3>${country.name.common}</h3>
                    <p><strong>Capital:</strong> ${country.capital ? country.capital[0] : 'N/A'}</p>
                    <p><strong>Region:</strong> ${country.region}</p>
                    <p><strong>Population:</strong> ${country.population.toLocaleString()}</p>
                </div>
            `).join('');
        }

        searchBtn.addEventListener('click', () => {
            const query = searchInput.value.trim();
            if (query) fetchCountry(query);
        });

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const query = searchInput.value.trim();
                if (query) fetchCountry(query);
            }
        });
    </script>
</body>
</html>
